name: Generate dependency lockfiles

on:
  push:
    branches:
      - chore/supply-chain-hardening
    paths:
      - requirements.in
      - requirements-dev.in
      - .github/workflows/generate-lockfiles.yml

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install lock tooling
        run: |
          python -m pip install "pip==26.1.2" "pip-tools==7.6.0"

      - name: Compile runtime lockfile
        run: |
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --no-header \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file=requirements.lock \
            requirements.in

      - name: Compile development lockfile
        run: |
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --no-header \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file=requirements-dev.lock \
            requirements-dev.in

      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock requirements-dev.lock

          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi

          git commit -m "build: regenerate dependency lockfiles"
          git push origin HEAD:chore/supply-chain-hardening
