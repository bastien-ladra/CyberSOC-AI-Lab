name: Temporary benchmark diagnostics

on:
  push:
    branches:
      - research/benchmark-scaffold

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Capture mypy diagnostics
        run: mypy . > mypy-diagnostic.txt 2>&1 || true

      - name: Build container image
        run: docker build --tag cybersoc-ai:diagnostic .

      - name: Capture Trivy diagnostics
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cybersoc-ai:diagnostic
          format: json
          output: trivy-diagnostic.json
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mypy-diagnostic.txt trivy-diagnostic.json
          git commit -m "chore: capture temporary CI diagnostics"
          git push
