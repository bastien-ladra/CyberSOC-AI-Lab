name: Temporary benchmark formatter

on:
  push:
    branches:
      - research/benchmark-scaffold

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install exact Black version
        run: python -m pip install "black==26.5.1"

      - name: Format benchmark files
        run: |
          black \
            ai_assistant/llm_client.py \
            research/__init__.py \
            research/cicids2017_ai.py \
            research/cicids2017_baseline.py \
            research/cicids2017_selection.py \
            research/cicids2017_validate.py \
            research/metrics.py \
            tests/test_cicids2017_research_ai.py \
            tests/test_cicids2017_research_baseline.py \
            tests/test_cicids2017_research_validator.py \
            tests/test_cicids2017_selection.py \
            tests/test_research_metrics.py \
            tests/test_llm_client.py

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ai_assistant/llm_client.py \
            research \
            tests/test_cicids2017_research_ai.py \
            tests/test_cicids2017_research_baseline.py \
            tests/test_cicids2017_research_validator.py \
            tests/test_cicids2017_selection.py \
            tests/test_research_metrics.py \
            tests/test_llm_client.py
          git commit -m "style: apply Black to research benchmark"
          git push
