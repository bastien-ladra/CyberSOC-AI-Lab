name: Temporary benchmark Ruff fix

on:
  push:
    branches:
      - research/benchmark-scaffold

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install exact Ruff version
        run: python -m pip install "ruff==0.16.5"

      - name: Fix new benchmark files
        run: ruff check research/run_benchmark.py tests/test_run_benchmark.py --fix

      - name: Commit fixes if needed
        run: |
          if git diff --quiet; then
            echo "No Ruff fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/run_benchmark.py tests/test_run_benchmark.py
          git commit -m "style: apply Ruff fixes to benchmark runner"
          git push
