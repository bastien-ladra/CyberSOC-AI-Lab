name: Python quality gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install lock tooling
        run: |
          python -m pip install "pip==26.1.2" "pip-tools==7.6.0"

      - name: Verify lockfiles are current
        run: |
          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --no-header \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file=requirements.lock \
            requirements.in

          python -m piptools compile \
            --generate-hashes \
            --resolver=backtracking \
            --no-header \
            --no-emit-index-url \
            --no-emit-trusted-host \
            --output-file=requirements-dev.lock \
            requirements-dev.in

          if ! git diff --exit-code -- requirements.lock requirements-dev.lock; then
            echo "::error::Dependency lockfiles are stale. Regenerate them with pip-tools."
            exit 1
          fi

      - name: Install hash-locked development dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip check

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.lock --strict

      - name: Check formatting with Black
        run: black --check .

      - name: Lint with Ruff
        run: ruff check .

      - name: Type-check with mypy
        run: mypy .

      - name: Security scan with Bandit
        run: bandit -r ai_assistant dashboard detection utils main.py -q

      - name: Run tests with coverage
        run: pytest --cov=ai_assistant --cov=detection --cov=utils --cov-report=term-missing --cov-fail-under=90 -q

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan full history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
